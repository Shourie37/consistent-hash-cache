[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consistent-hash-cache"
version = "0.1.0"
description = "A distributed cache cluster with consistent hashing, replication, and stampede protection."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shourie Amireddy" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
